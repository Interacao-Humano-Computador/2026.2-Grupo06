/text><text x="1960" y="401" font-size="17" text-anchor="middle">declaração</text><path d="M1878.0,443 L2042.0,443" fill="none" stroke="#222" stroke-width="1.6"/><path d="M2140,325 L2140,355" fill="none" stroke="#222" stroke-width="1.6"/><path d="M2136,347 L2140,355 L2144,347 Z"/><rect x="2058.0" y="355" width="164" height="82" fill="white" stroke="#222" stroke-width="1.6"/><text x="2140" y="379" font-size="17" text-anchor="middle">4.2 Conferir</text><text x="2140" y="401" font-size="17" text-anchor="middle">comprovação</text><path d="M2058.0,443 L2222.0,443" fill="none" stroke="#222" stroke-width="1.6"/><text x="1120" y="484" font-size="19" text-anchor="middle">Retângulo: objetivo | Retângulo sublinhado: operação | &gt;: sequência entre filhos imediatos</text><text x="1120" y="516" font-size="17" text-anchor="middle">Fonte da notação: Barbosa e Silva (2010), figuras 6.1–6.2, p. 193–194. Processo documental; ver condições dos planos no texto.</text></g></svg>