</defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#151515"><text x="1120" y="32" font-size="24" text-anchor="middle">HTA — organizar a participação da turma e obter a declaração</text><rect x="855.0" y="65" width="530" height="82" fill="white" stroke="#222" stroke-width="1.6"/><text x="1120" y="89" font-size="17" text-anchor="middle">0. Organizar a participação da turma</text><text x="1120" y="111" font-size="17" text-anchor="middle">e obter a declaração</text><text x="1120" y="133" font-size="17" text-anchor="middle">1 &gt; 2 &gt; 3 &gt; 4</text><path d="M1120,147 L1120,178" fill="none" stroke="#222" stroke-width="1.6"/><path d="M190,178 L2050,178" fill="none" stroke="#222" stroke-width="1.6"/><path d="M190,178 L190,207" fill="none" stroke="#222" stroke-width="1.6"/><path d="M186,199 L190,207 L194,199 Z"/><rect x="50.0" y="207" width="280" height="82" fill="white" stroke="#222" stroke-width="1.6"/><text x="190" y="231" font-size="17" text-anchor="middle">1. Preparar</text><text x="190" y="253" font-size="17" text-anchor="middle">a oficina</text><text x="190" y="275" font-size="17" text-anchor="middle">1 &gt; 2</text><path d="M190,289 L190,325" fill="none" stroke="#222" stroke-width="1.6"/><path d="M100,325 L280,325" fill="none" stroke="#222" stroke-width="1.6"/><path d="M100,325 L100,355" fill="none" stroke="#222" stroke-width="1.6"/><path d="M96,347 L100,355 L104,347 Z"/><rect x="18.0" y="355" width="164" height="82" fill="white" stroke="#222" stroke-width="1.6"/><text x="100" y="379" font-size="17" text-anchor="middle">1.1 Examinar</text><text x="100" y="401" font-size="17" text-anchor="middle">orientações</text><text x="100" y="423" font-size="17" text-anchor="middle">e material</text><path d="M18.0,443 L182.0,443" fill="none" stroke="#222" stroke-width="1.6"/><path d="M280,325 L280,355" fill="none" stroke="#222" stroke-width="1.6"/><path d="M276,347 L280,355 L284,347 Z"/><rect x="198.0" y="355" width="164" height="82