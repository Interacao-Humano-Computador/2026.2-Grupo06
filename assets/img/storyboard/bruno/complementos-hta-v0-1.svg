<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 540" role="img" aria-labelledby="title"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#152b40"/></marker></defs><title id="title">HTA do complemento</title><rect width="1440" height="540" fill="white"/><g font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#152b40"><rect x="480" y="20" width="480" height="70" fill="#eef5fa" stroke="#152b40" stroke-width="2"/><text x="720.0" y="47">0. Contribuir e verificar encaminhamento</text><text x="720.0" y="70">P0: 1 &gt; 2 &gt; 3 &gt; 4, sob condições</text><path d="M720 90 V120 H165.0 V150" fill="none" stroke="#152b40" stroke-width="2" marker-end="url(#arrow)"/><rect x="15" y="150" width="300" height="70" fill="#eef5fa" stroke="#152b40" stroke-width="2"/><text x="165.0" y="177">1. Identificar ideia</text><text x="165.0" y="200">P1: 1.1 &gt; 1.2</text><path d="M165.0 220 V270 H85 V310" fill="none" stroke="#152b40" stroke-width="2" marker-end="url(#arrow)"/><rect x="15" y="310" width="140" height="70" fill="#eef5fa" stroke="#152b40" stroke-width="2"/><text x="85.0" y="337">1.1</text><text x="85.0" y="360">Pesquisar ideias</text><path d="M15 386 H155" stroke="#152b40" stroke-width="2"/><path d="M165.0 220 V270 H235 V310" fill="none" stroke="#152b40" stroke-width="2" marker-end="url(#arrow)"/><rect x="165" y="310" width="140" height="70" fill="#eef5fa" stroke="#152b40" stroke-width="2"/><text x="235.0" y="337">1.2</text><text x="235.0" y="360">Examinar ideia</text><path d="M165 386 H305" stroke="#152b40" stroke-width="2"/><path d="M720 90 V120 H560.0 V150" fill="none" stroke="#152b40" stroke-width="2" marker-end="url(#arrow)"/><rect x="335" y="150" width="450" height="70" fill="#eef5fa" stroke="#152b40" stroke-width="2"/><text x="560.0" y="177">2. Submeter complemento</text><text x="560.0" y="200">P2: 2.1 &gt; 2.2 &gt; 2.3</text><path d="M560.0 220 V270 H405 V310" fill="none" stroke="#152b40" stroke-width="2" marker-end="url(#arrow)"/><rect x="335" y="310" width="140" height="70" fill="#eef5fa" stroke="#152b40" stroke-width="2"/><text x="405.0" y="337">2.1</text><text x="405.0" y="360">Autenticar</text><path d="M335 386 H475" stroke="#152b40" stroke-width="2"/><path d="M560.0 220 V270 H555 V310" fill="none" stroke="#152b40" stroke-width="2" marker-end="url(#arrow)"/><rect x="485" y="310" width="140" height="70" fill="#eef5fa" stroke="#152b40" stroke-width="2"/><text x="555.0" y="337">2.2</text><text x="555.0" y="360">Redigir/revisar</text><path d="M485 386 H625" stroke="#152b40" stroke-width="2"/><path d="M560.0 220 V270 H705 V310" fill="none" stroke="#152b40" stroke-width="2" marker-end="url(#arrow)"/><rect x="635" y="310" width="140" height="70" fill="#eef5fa" stroke="#152b40" stroke-width="2"/><text x="705.0" y="337">2.3</text><text x="705.0" y="360">Enviar/conferir</text><path d="M635 386 H775" stroke="#152b40" stroke-width="2"/><path d="M720 90 V120 H955.0 V150" fill="none" stroke="#152b40" stroke-width="2" marker-end="url(#arrow)"/><rect x="805" y="150" width="300" height="70" fill="#eef5fa" stroke="#152b40" stroke-width="2"/><text x="955.0" y="177">3. Resolver ajuste</text><text x="955.0" y="200">P3: 3.1 &gt; 3.2, se concordar</text><path d="M955.0 220 V270 H875 V310" fill="none" stroke="#152b40" stroke-width="2" marker-end="url(#arrow)"/><rect x="805" y="310" width="140" height="70" fill="#eef5fa" stroke="#152b40" stroke-width="2"/><text x="875.0" y="337">3.1</text><text x="875.0" y="360">Examinar ajuste</text><path d="M805 386 H945" stroke="#152b40" stroke-width="2"/><path d="M955.0 220 V270 H1025 V310" fill="none" stroke="#152b40" stroke-width="2" marker-end="url(#arrow)"/><rect x="955" y="310" width="140" height="70" fill="#eef5fa" stroke="#152b40" stroke-width="2"/><text x="1025.0" y="337">3.2</text><text x="1025.0" y="360">Confirmar versão</text><path d="M955 386 H1095" stroke="#152b40" stroke-width="2"/><path d="M720 90 V120 H1275.0 V150" fill="none" stroke="#152b40" stroke-width="2" marker-end="url(#arrow)"/><rect x="1125" y="150" width="300" height="70" fill="#eef5fa" stroke="#152b40" stroke-width="2"/><text x="1275.0" y="177">4. Verificar destino</text><text x="1275.0" y="200">P4: 4.1 &gt; 4.2, sob condições</text><path d="M1275.0 220 V270 H1195 V310" fill="none" stroke="#152b40" stroke-width="2" marker-end="url(#arrow)"/><rect x="1125" y="310" width="140" height="70" fill="#eef5fa" stroke="#152b40" stroke-width="2"/><text x="1195.0" y="337">4.1</text><text x="1195.0" y="360">Ver publicação</text><path d="M1125 386 H1265" stroke="#152b40" stroke-width="2"/><path d="M1275.0 220 V270 H1345 V310" fill="none" stroke="#152b40" stroke-width="2" marker-end="url(#arrow)"/><rect x="1275" y="310" width="140" height="70" fill="#eef5fa" stroke="#152b40" stroke-width="2"/><text x="1345.0" y="337">4.2</text><text x="1345.0" y="360">Ver envio</text><path d="M1275 386 H1415" stroke="#152b40" stroke-width="2"/><text x="720" y="435">Linhas: decomposição. Traço abaixo do retângulo: operação terminal.</text><text x="720" y="470">Planos completos, entradas, ações e retornos: Tabelas 2 e 3.</text><text x="720" y="505">Eventos externos condicionam o avanço; não são ações da proponente.</text></g></svg>