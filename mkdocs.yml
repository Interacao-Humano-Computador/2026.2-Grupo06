site_name: Grupo 06
site_description: Documentação do projeto de Interação Humano-Computador do Grupo 06, FCTE/UnB, 2026.2.
site_author: Grupo 06 — IHC 2026.2
site_url: https://interacao-humano-computador.github.io/2026.2-Grupo06/

repo_url: https://github.com/Interacao-Humano-Computador/2026.2-Grupo06
repo_name: 2026.2-Grupo06
edit_uri: edit/main/docs/

copyright: Grupo 06 · Interação Humano-Computador · FCTE/UnB · 2026.2

theme:
  name: material
  language: pt-BR
  custom_dir: overrides
  logo: assets/img/marca/senado-icon.png
  favicon: assets/img/marca/senado-icon.png
  font:
    text: Outfit
    code: IBM Plex Mono
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.path
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Ativar modo escuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Ativar modo claro

exclude_docs: |
  includes/**

plugins:
  - search:
      lang: pt
  - glightbox:
      touchNavigation: true
      loop: false
      skip_classes:
        - team-photo
        - no-lightbox
        - brand-mark

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      permalink_title: Ligação permanente para esta seção
  - tables
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
      base_path:
        - docs
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - assets/css/extra.css

extra_javascript:
  - assets/js/a11y.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Interacao-Humano-Computador/2026.2-Grupo06
      name: Repositório do grupo no GitHub

